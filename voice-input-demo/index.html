<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>🎤 离线中文语音输入演示</title>
<style>
  :root { --bg:#0f1420; --card:#1a2233; --line:#2a3550; --fg:#e6ebf5; --dim:#8b97ad; --accent:#4f8cff; --rec:#ff4d5e; }
  * { box-sizing:border-box; }
  body { margin:0; min-height:100vh; display:flex; align-items:center; justify-content:center;
         background:var(--bg); color:var(--fg); font-family:"Microsoft YaHei UI","Segoe UI",system-ui,sans-serif; }
  .card { width:min(680px,92vw); background:var(--card); border:1px solid var(--line); border-radius:16px;
          padding:32px 36px; box-shadow:0 12px 40px rgba(0,0,0,.45); }
  h1 { font-size:22px; margin:0 0 4px; }
  .sub { color:var(--dim); font-size:13px; margin:0 0 22px; }
  #status { font-size:14px; color:var(--dim); margin-bottom:14px; min-height:20px; }
  .row { display:flex; gap:14px; align-items:center; flex-wrap:wrap; }
  #record { width:96px; height:96px; border-radius:50%; border:none; cursor:pointer; font-size:15px;
            background:var(--accent); color:#fff; font-weight:600; transition:transform .12s, background .15s; user-select:none; }
  #record:active { transform:scale(.93); }
  #record.recording { background:var(--rec); animation:pulse 1s infinite; }
  @keyframes pulse { 0%,100%{box-shadow:0 0 0 0 rgba(255,77,94,.5)} 50%{box-shadow:0 0 0 14px rgba(255,77,94,0)} }
  #record:disabled, #demo:disabled { opacity:.45; cursor:not-allowed; }
  #demo { height:44px; padding:0 18px; border-radius:10px; border:1px solid var(--line); cursor:pointer;
          background:transparent; color:var(--fg); font-size:14px; }
  #demo:hover { border-color:var(--accent); color:var(--accent); }
  .result-box { margin-top:20px; min-height:96px; border:1px dashed var(--line); border-radius:12px;
                padding:16px 18px; font-size:17px; line-height:1.7; word-break:break-all; }
  .result-box .placeholder { color:var(--dim); font-size:14px; }
  #meta { margin-top:10px; font-size:12px; color:var(--dim); min-height:16px; }
  .hint { margin-top:18px; font-size:12px; color:var(--dim); line-height:1.8; border-top:1px solid var(--line); padding-top:12px; }
  code { background:#0b0f18; padding:1px 6px; border-radius:4px; font-size:12px; }
</style>
</head>
<body>
  <div class="card">
    <h1>🎤 离线中文语音输入演示</h1>
    <p class="sub">sherpa-onnx（浏览器 WASM 构建）· 本地识别 · 音频不出本机 · 按住说话</p>
    <div id="status">正在加载模型…（首次约需数秒）</div>
    <div class="row">
      <button id="record" disabled>按住<br>说话</button>
      <div style="flex:1">
        <button id="demo" disabled>▶ 用内置测试音频演示</button>
        <div class="hint">
          ① 点「按住说话」→ ② 按住按钮说中文 → ③ 松开 → 文字上屏。<br>
          没有麦克风/不想授权时，点测试音频按钮体验同一条识别链路。<br>
          模型与运行时均在本机（<code>model/model.int8.onnx</code>，59.8MB int8），全程无网络请求。
        </div>
      </div>
    </div>
    <div class="result-box"><span id="result" class="placeholder">识别结果将显示在这里…</span></div>
    <div id="meta"></div>
  </div>
  <script type="module" src="app.js"></script>
</body>
</html>
